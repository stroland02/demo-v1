name: build
on:
  push:
    branches: [main, 'sync/**']
  pull_request:
    branches: [main]

env:
  STRIPE_SECRET_KEY: sk_secret_key
  STRIPE_PUBLIC_KEY: pk_pub_key
  NEXT_PUBLIC_STRIPE_PUBLIC_KEY: pk_pub_key
  # Build-time stand-ins: Next evaluates route modules during page-data collection, and the
  # AI clients are constructed at module scope, so the build needs a value present even
  # though CI never calls a model.
  OPENAI_API_KEY: sk-test-not-a-real-key
  ANTHROPIC_API_KEY: sk-ant-test-not-a-real-key
  APP_NAME: Furever
  PORT: 3000
  SECRET: S3cr3t
  MONGO_URI: 'mongodb://localhost/furever'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: 22.x
      - run: yarn install --frozen-lockfile
      - run: yarn run validate-change
      - run: yarn run build
